name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        working-directory: /home/wesbaker/dewey
        run: |
          git checkout main
          git pull --ff-only origin main

      - name: Check if dependencies changed
        id: deps
        working-directory: /home/wesbaker/dewey
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD@{1} HEAD -- package-lock.json 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop bot
        if: steps.deps.outputs.changed == 'true'
        working-directory: /home/wesbaker/dewey
        run: pm2 stop dewey 2>/dev/null || true

      - name: Install dependencies
        if: steps.deps.outputs.changed == 'true'
        working-directory: /home/wesbaker/dewey
        run: npm ci

      - name: Build
        working-directory: /home/wesbaker/dewey
        run: npm run build

      - name: Start bot
        if: steps.deps.outputs.changed == 'true'
        working-directory: /home/wesbaker/dewey
        run: |
          if pm2 describe dewey >/dev/null 2>&1; then
            pm2 start dewey --update-env
          else
            pm2 start ecosystem.config.cjs --only dewey --update-env
          fi

      - name: Restart bot
        if: steps.deps.outputs.changed == 'false'
        working-directory: /home/wesbaker/dewey
        run: pm2 restart dewey --update-env
